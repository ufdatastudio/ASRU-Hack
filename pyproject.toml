[project]
name = "asru-hack"
version = "0.1.0"
description = "African Health Studio - Mental Health Support Platform"
readme = "README.md"
requires-python = ">=3.12, <3.13"

# Core dependencies (always installed)
dependencies = [
    "fastapi>=0.121.3",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
    "python-dotenv>=1.2.1",
    "pydub>=0.25.1",
    "static-ffmpeg>=2.13",
    "soundfile>=0.13.1",
    "numpy>=2.3.5",
    "httpx>=0.27.0",  # For calling backend services
    "torch",  # Base PyTorch - version managed by dependency groups
]

# Optional dependency groups
[project.optional-dependencies]

# Audio Flamingo 3 dependencies
af3 = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.48.2",
    "datasets>=4.4.1",
    "decord>=0.6.0",
    "deepspeed>=0.18.2",
    "einops>=0.8.1",
    "einops-exts>=0.0.4",
    "fire>=0.7.1",
    "ftfy>=6.3.1",
    "hydra-core>=1.3.2",
    "jiwer>=4.0.0",
    "kaldiio>=2.18.1",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "openai-whisper>=20250625",
    "peft>=0.18.0",
    "pytorchvideo>=0.1.5",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "shortuuid>=1.0.13",
    "tensorboard>=2.20.0",
    "timm>=1.0.22",
    "transformers>=4.57.1",
    "wandb>=0.23.0",
    "webdataset>=1.0.2",
    "ffmpeg-python>=0.2.0",
    # Audio Flamingo package (if using HuggingFace fallback)
    # "audio-flamingo @ git+https://github.com/NVIDIA/audio-flamingo-3",
]

# Afro-TTS dependencies
tts = [
    "TTS",  # Text-to-speech library
]

# All dependencies (for full installation) - includes both groups
all = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.48.2",
    "datasets>=4.4.1",
    "decord>=0.6.0",
    "deepspeed>=0.18.2",
    "einops>=0.8.1",
    "einops-exts>=0.0.4",
    "fire>=0.7.1",
    "ftfy>=6.3.1",
    "hydra-core>=1.3.2",
    "jiwer>=4.0.0",
    "kaldiio>=2.18.1",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "openai-whisper>=20250625",
    "peft>=0.18.0",
    "pytorchvideo>=0.1.5",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "shortuuid>=1.0.13",
    "tensorboard>=2.20.0",
    "timm>=1.0.22",
    "transformers>=4.57.1",
    "wandb>=0.23.0",
    "webdataset>=1.0.2",
    "ffmpeg-python>=0.2.0",
    "TTS",
]
